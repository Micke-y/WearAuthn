name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Resolve version
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        run: |
          ./gradlew -PversionName=${{ steps.vars.outputs.version_name }} \
                    -PversionCode=${{ steps.vars.outputs.version_code }} \
                    -PstoreFile=release.jks \
                    -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
                    -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
                    -PkeyPassword="${{ secrets.KEY_PASSWORD }}" \
                    assemblePlayStoreRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp authenticator/build/outputs/apk/playStore/release/*.apk \
             dist/WearAuthn-${{ steps.vars.outputs.version_name }}.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/WearAuthn-${{ steps.vars.outputs.version_name }}.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Upload as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WearAuthn-release
          path: dist/*
