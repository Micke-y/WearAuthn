name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.0（会创建 tag v1.0.0 并发布）'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Decode signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          test -s release.jks || { echo "KEYSTORE_BASE64 is missing or empty"; exit 1; }

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="v${{ inputs.version }}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "version_name=${V#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from changelog
        run: |
          V="${{ steps.vars.outputs.version_name }}"
          awk -v ver="## v$V" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "详见 [CHANGELOG.md](https://github.com/Micke-y/WearAuthn/blob/master/CHANGELOG.md)" > notes.md
          fi
          cat notes.md

      - name: Assemble release
        run: |
          ./gradlew -PversionName=${{ steps.vars.outputs.version_name }} \
                    -PversionCode=${{ steps.vars.outputs.version_code }} \
                    -PstoreFile=${GITHUB_WORKSPACE}/release.jks \
                    -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
                    -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
                    -PkeyPassword="${{ secrets.KEY_PASSWORD }}" \
                    assemblePlayStoreRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp authenticator/build/outputs/apk/playStore/release/*.apk \
             dist/WearAuthn-${{ steps.vars.outputs.version_name }}.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload to existing release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: notes.md
          files: |
            dist/WearAuthn-${{ steps.vars.outputs.version_name }}.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Publish new release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.vars.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.vars.outputs.tag }}" dist/* --clobber
          else
            gh release create "${{ steps.vars.outputs.tag }}" \
              --target "$GITHUB_SHA" \
              --title "WearAuthn ${{ steps.vars.outputs.version_name }}" \
              --notes-file notes.md \
              dist/WearAuthn-${{ steps.vars.outputs.version_name }}.apk dist/SHA256SUMS.txt
          fi
